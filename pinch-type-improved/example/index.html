<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pinch Type Improved - Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #141414;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .controls button {
      padding: 8px 16px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a1a;
      color: #999;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .controls button:hover {
      background: #222;
      color: #ccc;
    }

    .controls button.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .info {
      padding: 4px 16px;
      font-size: 11px;
      color: #555;
      background: #141414;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      min-height: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="controls">
      <button id="btn-uniform" class="active">Uniform (Pinch)</button>
      <button id="btn-morph">Scroll Morph</button>
      <button id="btn-combined">Combined</button>
    </div>
    <div class="info">
      Scroll or swipe to navigate &bull; Pinch to zoom (Uniform &amp; Combined modes) &bull; Arrow keys / Page Up/Down / Home/End
    </div>
    <div id="canvas-container"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
